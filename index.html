<!DOCTYPE html> 
<html>
    <body>
        <h2>
            js async functions
        </h2>
        <h3 id = "demo"></h3>
        <script>
            async function product(a,b){
                let response = await a * b;

                return response;

            }
            function display(some){
                document.getElementById("demo").innerHTML = some;
            }
            product(5,20).then(display);

        </script>
   </body>
</html>
